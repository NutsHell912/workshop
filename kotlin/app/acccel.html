<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Accelerometer Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #controls {
      padding: 10px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #chart-container {
      flex: 1;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    label {
      font-size: 14px;
    }

    input {
      width: 70px;
    }

    .hint {
      font-size: 11px;
      color: #666;
      display: block;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="controls">
  <input type="file" id="fileInput" />

  <label>
    Gravity
    <input type="number" id="gravityWindow" value="50">
    <span class="hint">default: 50</span>
  </label>

  <label>
    Smooth
    <input type="number" id="smoothWindow" value="10">
    <span class="hint">default: 10</span>
  </label>

  <label>
    Threshold
    <input type="number" step="0.1" id="threshold" value="1.2">
    <span class="hint">default: 1.2</span>
  </label>

  <label>
    Debounce
    <input type="number" id="debounce" value="300">
    <span class="hint">default: 300 ms</span>
  </label>

  <button id="recalc">Пересчитать</button>

  <span style="margin-left:20px;">
    Steps: <b id="steps">0</b>
  </span>
</div>

<div id="chart-container">
  <canvas id="chart"></canvas>
</div>

<script>
let chart;
let rawData = [];

// загрузка файла
document.getElementById('fileInput').addEventListener('change', function(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    const lines = e.target.result.split('\n').filter(l => l.trim());
    rawData = lines.map(line => JSON.parse(line));
    processAndDraw();
  };

  reader.readAsText(file);
});

// кнопка пересчёта
document.getElementById('recalc').addEventListener('click', processAndDraw);

// основная обработка
function processAndDraw() {
  if (!rawData.length) return;

  const gravityWindow = +document.getElementById('gravityWindow').value;
  const smoothWindow = +document.getElementById('smoothWindow').value;
  const threshold = +document.getElementById('threshold').value;
  const debounceMs = +document.getElementById('debounce').value;

  const t0 = rawData[0].t;

  // magnitude
  const magnitudes = rawData.map(d => Math.sqrt(d.x*d.x + d.y*d.y + d.z*d.z));

  // гравитация
  const gravity = movingAverage(magnitudes, gravityWindow);

  // убираем гравитацию
  const linearAcc = magnitudes.map((m, i) => m - gravity[i]);

  // сглаживание
  const smooth = movingAverage(linearAcc, smoothWindow);

  // шаги
  const { steps, stepIndices } = countSteps(smooth, rawData, threshold, debounceMs);

  document.getElementById('steps').innerText = steps;

  // точки графика
  const points = smooth.map((val, i) => ({
    x: (rawData[i].t - t0) / 1000,
    y: val
  }));

  drawChart(points, stepIndices);
}

// скользящее среднее
function movingAverage(arr, windowSize) {
  const result = [];
  let sum = 0;

  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];

    if (i >= windowSize) {
      sum -= arr[i - windowSize];
    }

    result.push(sum / Math.min(i + 1, windowSize));
  }

  return result;
}

// подсчёт шагов
function countSteps(signal, data, threshold, debounceMs) {
  let steps = 0;
  let lastStepTime = 0;
  const stepIndices = [];

  for (let i = 1; i < signal.length; i++) {
    const prev = signal[i - 1];
    const curr = signal[i];

    if (prev < threshold && curr >= threshold) {
      const t = data[i].t;

      if (t - lastStepTime > debounceMs) {
        steps++;
        lastStepTime = t;
        stepIndices.push(i);
      }
    }
  }

  return { steps, stepIndices };
}

// отрисовка
function drawChart(points, stepIndices = []) {
  const ctx = document.getElementById('chart').getContext('2d');

  if (chart) chart.destroy();

  const stepPoints = stepIndices.map(i => points[i]);

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Signal',
          data: points,
          borderWidth: 1,
          pointRadius: 0
        },
        {
          label: 'Steps',
          data: stepPoints,
          pointRadius: 4,
          showLine: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Time (s)' }
        },
        y: {
          title: { display: true, text: 'Acceleration' }
        }
      }
    }
  });
}
</script>

</body>
</html>
